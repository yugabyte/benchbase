type: YUGABYTE
driver: com.yugabyte.Driver
url: jdbc:yugabytedb://{{endpoint}}:5433/yugabyte?sslmode=require&ApplicationName=featurebench&reWriteBatchedInserts=true&load-balance=true
username: {{username}}
password: {{password}}
batchsize: 128
isolation: TRANSACTION_REPEATABLE_READ
loaderthreads: 1
terminals: 1
collect_pg_stat_statements: true
use_dist_in_explain: true
yaml_version: v1.0
targetCPU: 75
toleranceCPU: 5
optimalThreads: false
samplingTime: 120
time: 600
useThroughputThreshold: true
works:
    work:
        time_secs: 600
        rate: unlimited
        warmup: 180
microbenchmark:
    class: com.oltpbenchmark.benchmarks.featurebench.customworkload.YBDefaultMicroBenchmark
    properties:
        setAutoCommit: false
        create:
            - DROP TABLE IF EXISTS THRPT_MVI_1_sysbench;
            - CREATE TABLE THRPT_MVI_1_sysbench (k INTEGER, id INTEGER, c CHAR(1024), pad CHAR(60), PRIMARY KEY (k ASC, id ASC)) SPLIT AT VALUES ((4), (7));
        cleanup:
            - DROP TABLE IF EXISTS THRPT_MVI_1_sysbench;

        iterationCleanup:
            - DROP TABLE IF EXISTS THRPT_MVI_1_sysbench;
            - CREATE TABLE THRPT_MVI_1_sysbench (k INTEGER, id INTEGER, c CHAR(1024), pad CHAR(60), PRIMARY KEY (k ASC, id ASC)) SPLIT AT VALUES ((4), (7));

        loadRules:
            - table: THRPT_MVI_1_sysbench
              rows: 10000000
              columns:
                  - name: k
                    util: RandomUniqueCyclicIntGen
                    params: [1, 9, 1]
                  - name: id
                    util: PrimaryIntGen
                    params: [1, 10000000]
                  - name: c
                    util: RandomAString
                    params: [1024, 1024]
                  - name: pad
                    util: RandomAString
                    params: [60, 60]

        executeRules:
            - workload: THRPT_multivalue_insert_1row_sysbench
              run:
                  - name: THRPT_multivalue_insert_1row_sysbench
                    weight: 100
                    queries:
                        - query: INSERT INTO THRPT_MVI_1_sysbench VALUES (?,?,?,?)
                          count: 10
                          bindings:
                              - util: RandomUniqueCyclicIntGen
                                params: [1, 9, 1]
                              - util: PrimaryIntGenThroughput
                                params: [10000001, 2147483646]
                              - util: RandomAString
                                params: [1024, 1024]
                              - util: RandomAString
                                params: [60, 60]