#TEST FOR YUGABYTE REGULAR TABLES
#GOAL: Measure latency of reading only the LAST column from a table with 500 columns.
#      Projects only the last column (col_bigint_499) via point lookup and range scans.
#TESTS:
#   1. Point lookup returning 1 row
#   2. Range scan returning 10, 100, 1000 rows

type: YUGABYTE
driver: com.yugabyte.Driver
url: jdbc:yugabytedb://{{endpoint}}:5433/yugabyte?sslmode=require&ApplicationName=featurebench&reWriteBatchedInserts=true&load-balance=true
username: {{username}}
password: {{password}}
batchsize: 128
isolation: TRANSACTION_REPEATABLE_READ
loaderthreads: 1
terminals: 1
collect_pg_stat_statements: true
use_dist_in_explain: true
yaml_version: v1.0
works:
    work:
        time_secs: 120
        active_terminals: 1
        rate: unlimited
        warmup: 30
microbenchmark:
    class: com.oltpbenchmark.benchmarks.featurebench.customworkload.YBDefaultMicroBenchmark
