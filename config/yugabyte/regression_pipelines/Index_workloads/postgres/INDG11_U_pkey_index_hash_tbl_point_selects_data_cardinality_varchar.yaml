#Table1	1*1M	1000*1k	    10000*100
#Table2	1*1L	1000*100	10000*10
#Table3	1*10k	1000*10	    10000*1
type: POSTGRES
driver: org.postgresql.Driver
url: jdbc:postgresql://{{endpoint}}:5432/postgres?sslmode=require
username: {{username}}
password: {{password}}
batchsize: 128
isolation: TRANSACTION_REPEATABLE_READ
loaderthreads: 1
terminals: 1
collect_pg_stat_statements: true
yaml_version: v2.0
works:
    work:
        time_secs: 180
        active_terminals: 1
        rate: unlimited
        warmup: 60
microbenchmark:
    class: com.oltpbenchmark.benchmarks.featurebench.customworkload.YBDefaultMicroBenchmark
    properties:
        setAutoCommit: true
        create:
          - DROP TABLE IF EXISTS INDG11_U_pkeyVarchar10_1;
          - CREATE TABLE INDG11_U_pkeyVarchar10_1(col_varchar_card1_1 varchar(15), col_varchar_card2_1 varchar(15), col_varchar_card3_1 varchar(15), col_bigint_id_1 bigint, col_bigint_id_2 bigint, col_bigint_id_3 bigint, col_float2_1 float(2), col_float2_2 float(2), col_float5_1 float(5), col_float5_2 float(5), col_boolean_1 boolean, col_varchar10_id_1 varchar(10), col_varchar100_id_1 varchar(100), col_varchar100_id_2 varchar(100), col_varchar500_id_1 varchar(500), PRIMARY KEY(col_varchar_card1_1, col_varchar_card2_1, col_varchar_card3_1, col_bigint_id_1));

        cleanup:
            - DROP TABLE IF EXISTS INDG11_U_pkeyVarchar10_1;

        loadRules:
              - table: INDG11_U_pkeyVarchar10_
                count: 1
                rows: 1000000
                columns:
                    - name: col_varchar_card1_
                      count: 1
                      util: RandomUniqueCyclicStringGen
                      params: [ 1, 50, 10000 ]
                    - name: col_varchar_card2_
                      count: 1
                      util: CyclicSeqStringGen
                      params: [ 1, 1000 ]
                    - name: col_varchar_card3_
                      count: 1
                      util: CyclicSeqStringGen
                      params: [ 1, 10000 ]
                    - name: col_bigint_id_
                      count: 3
                      util: RandomUniqueIntGen
                      params: [ 1, 1000000 ]
                    - name: col_float2_
                      count: 2
                      util: RandomNoWithDecimalPoints
                      params: [ 1, 1000000, 2 ]
                    - name: col_float5_
                      count: 2
                      util: RandomNoWithDecimalPoints
                      params: [ 1, 1000000, 5 ]
                    - name: col_boolean_
                      count: 1
                      util: RandomBoolean
                    - name: col_varchar10_id_
                      count: 1
                      util: PrimaryStringGen
                      params: [1, 10]
                    - name: col_varchar100_id_
                      count: 2
                      util: PrimaryStringGen
                      params: [1, 100]
                    - name: col_varchar500_id_
                      count: 1
                      util: PrimaryStringGen
                      params: [1, 500]

        executeRules:

            - workload: INDG11_1_data_cardinality_hashtbl_point_lookup_index_scan_using_comp_skey_first_part_hash_1M
              run:
                  - name: hashtbl_index_scan_using_sec_index
                    weight: 100
                    queries:
                        - query: select * from INDG11_U_pkeyVarchar10_1 where col_varchar_card1_1=?
                          bindings:
                            - util: RandomUniqueCyclicStringGen
                              params: [ 1, 50, "id-" ]

            - workload: INDG11_2_data_cardinality_hashtbl_point_lookup_index_scan_using_comp_skey_sec_part_hash_1k
              run:
                  - name: hashtbl_index_scan_using_sec_index
                    weight: 100
                    queries:
                        - query: select * from INDG11_U_pkeyVarchar10_1 where col_varchar_card2_1=?
                          bindings:
                            - util: CyclicSeqStringGen
                              params: [ 1, 1000, "id-" ]


            - workload: INDG11_2_data_cardinality_hashtbl_point_lookup_index_scan_using_comp_skey_sec_part_hash_1k_two_conditions
              customTags: customer=1
              run:
                  - name: hashtbl_index_scan_using_sec_index
                    weight: 100
                    queries:
                        - query: select * from INDG11_U_pkeyVarchar10_1 where col_varchar_card1_1=? and col_varchar_card2_1 between ? and ?
                          bindings:
                            - util: RandomUniqueCyclicStringGen
                              params: [ 1, 50, "id-" ]
                            - util: CyclicSeqStringGen
                              params: [ 1, 980, "id-" ]
                            - util: CyclicSeqStringGen
                              params: [ 20, 1000, "id-" ]

            - workload: INDG11_2_data_cardinality_hashtbl_point_lookup_index_scan_using_comp_skey_third_part_hash_100_two_conditions
              run:
                  - name: hashtbl_index_scan_using_sec_index
                    weight: 100
                    queries:
                        - query: select * from INDG11_U_pkeyVarchar10_1 where col_varchar_card1_1=? and col_varchar_card3_1=?
                          bindings:
                            - util: RandomUniqueCyclicStringGen
                              params: [ 1, 50, "id-" ]
                            - util: CyclicSeqStringGen
                              params: [ 1, 10000, "id-" ]

            - workload: INDG11_2_data_cardinality_hashtbl_point_lookup_index_scan_using_comp_skey_third_part_hash_100_two_conditions
              run:
                  - name: hashtbl_index_scan_using_sec_index
                    weight: 100
                    queries:
                        - query: select * from INDG11_U_pkeyVarchar10_1 where col_varchar_card1_1=? and col_varchar_card3_1=?
                          bindings:
                            - util: RandomUniqueCyclicStringGen
                              params: [ 1, 50, "id-" ]
                            - util: CyclicSeqStringGen
                              params: [ 1, 10000, "id-" ]
