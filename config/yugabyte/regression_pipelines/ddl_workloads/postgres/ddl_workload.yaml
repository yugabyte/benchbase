type: postgres
driver: org.postgresql.Driver
url: jdbc:postgresql://{{endpoint}}:5432/postgres?sslmode=require&ApplicationName=featurebench&reWriteBatchedInserts=true
username: {{username}}
password: {{password}}
batchsize: 128
isolation: TRANSACTION_REPEATABLE_READ
loaderthreads: 1
terminals: 1
collect_pg_stat_statements: true
yaml_version: v1.0
works:
    work:
        time_secs: 120
        rate: unlimited
        warmup: 10
microbenchmark:
    class: com.oltpbenchmark.benchmarks.featurebench.customworkload.YBDefaultMicroBenchmark
    properties:
        setAutoCommit: true
        create:
            - DO $$ BEGIN EXECUTE (SELECT string_agg('DROP TABLE ' || tablename || ' CASCADE', '; ') FROM pg_tables WHERE tablename LIKE 'employees_%'); END $$;

        cleanup:
            - DO $$ BEGIN EXECUTE (SELECT string_agg('DROP TABLE ' || tablename || ' CASCADE', '; ') FROM pg_tables WHERE tablename LIKE 'employees_%'); END $$;

        executeRules:
            - workload: create_table_ddl
              time_secs: 300
              raw_sql: true
              run:
                  - name: create_table_ddl
                    weight: 100
                    queries:
                        - query: CREATE TABLE employees_? (dept_id INT, emp_id INT, name VARCHAR(10), email VARCHAR(20), salary FLOAT, hire_date DATE, department VARCHAR(20), payload TEXT, details TEXT, is_active BOOLEAN, last_login TIMESTAMP, primary key(dept_id, emp_id));
                          bindings:
                              - util: PrimaryIntGen
                                params: [1, 1000000]
            
            - workload: insert_data
              time_secs: 600
              raw_sql: true
              skipReport: true
              run:
                  - name: insert_data
                    weight: 100
                    queries:
                        - query: INSERT INTO employees_? (dept_id,emp_id,name,email,salary,hire_date,department,payload,details,is_active,last_login) SELECT i/1000,i,'Employee','employee@test.com',50000,CURRENT_DATE,'Engineering',repeat('x',256),repeat('x',256),true,CURRENT_TIMESTAMP FROM generate_series(1,100000)i;
                          bindings:
                              - util: CyclicSeqIntGen
                                params: [1, 1000000]

            - workload: create_index_ddl
              time_secs: 300
              raw_sql: true
              run:
                  - name: create_index_ddl
                    weight: 100
                    queries:
                        - query: CREATE INDEX idx_employees_?_id ON employees_? (emp_id);
                          bindings:
                              - util: PrimaryIntGen
                                count: 2
                                params: [1, 1000000]

            - workload: alter_table_add_col_ddl
              raw_sql: true
              run:
                  - name: alter_table_add_col_ddl
                    weight: 100
                    queries:
                        - query: ALTER TABLE employees_? ADD COLUMN address VARCHAR(100);
                          bindings:
                              - util: PrimaryIntGen
                                params: [1, 1000000]

            - workload: alter_table_drop_col_ddl
              raw_sql: true
              run:
                  - name: alter_table_drop_col_ddl
                    weight: 100
                    queries:
                        - query: ALTER TABLE employees_? DROP COLUMN address;
                          bindings:
                              - util: PrimaryIntGen
                                params: [1, 1000000]

            - workload: drop_index_ddl  
              time_secs: 30
              raw_sql: true
              run:
                  - name: drop_index_ddl
                    weight: 100
                    queries:
                        - query: DROP INDEX idx_employees_?_id;
                          bindings:
                              - util: PrimaryIntGen
                                params: [1, 1000000]

            - workload: drop_table_ddl
              raw_sql: true
              run:
                  - name: drop_table_ddl
                    weight: 100
                    queries:
                        - query: DROP TABLE employees_?;
                          bindings:
                              - util: PrimaryIntGen
                                params: [1, 1000000]