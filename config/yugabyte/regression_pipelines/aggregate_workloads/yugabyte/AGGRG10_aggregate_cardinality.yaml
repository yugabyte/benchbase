type: YUGABYTE
driver: com.yugabyte.Driver
url: jdbc:yugabytedb://{{endpoint}}:5433/yugabyte?sslmode=require&ApplicationName=featurebench&reWriteBatchedInserts=true&load-balance=false
username: {{username}}
password: {{password}}
batchsize: 128
isolation: TRANSACTION_REPEATABLE_READ
loaderthreads: 1
terminals: 1
collect_pg_stat_statements: true
use_dist_in_explain : true
analyze_on_all_tables: true
yaml_version: v1.0
works:
    work:
        time_secs: 300
        active_terminals: 1
        rate: unlimited
        warmup: 180
microbenchmark:
    class: com.oltpbenchmark.benchmarks.featurebench.customworkload.YBDefaultMicroBenchmark
    properties:
        setAutoCommit: true
        create:
          - DROP TABLE IF EXISTS pkeyBigint1M_1;
          - CREATE TABLE pkeyBigint1M_1(split_id int, col_bigint_card1_1 bigint, col_bigint_card2_1 bigint, col_bigint_card3_1 bigint, col_bigint_id_1 bigint, col_bigint_id_2 bigint, col_bigint_id_3 bigint, col_float2_1 float(2), col_float2_2 float(2), col_float5_1 float(5), col_float5_2 float(5), col_boolean_1 boolean, col_varchar10_id_1 varchar(10), col_varchar100_id_1 varchar(100), col_varchar100_id_2 varchar(100), col_varchar500_id_1 varchar(500), PRIMARY KEY(split_id asc, col_bigint_card1_1 asc, col_bigint_card2_1 asc, col_bigint_card3_1 asc, col_bigint_id_1 asc)) SPLIT AT VALUES ((4), (7));
        cleanup:
            - DROP TABLE IF EXISTS pkeyBigint1M_1;

        loadRules:
              - table: pkeyBigint1M_
                count: 1
                rows: 1000000
                columns:
                    - name: split_id
                      util: CyclicSeqIntGen
                      params: [ 1, 9 ]
                    - name: col_bigint_card1_
                      count: 1
                      util: OneNumberFromArray
                      params: [ 1000000 ]
                    - name: col_bigint_card2_
                      count: 1
                      util: CyclicSeqIntGen
                      params: [ 1000001, 1001000 ]
                    - name: col_bigint_card3_
                      count: 1
                      util: CyclicSeqIntGen
                      params: [ 1000001, 1010000]
                    - name: col_bigint_id_
                      count: 3
                      util: PrimaryIntGen
                      params: [ 1, 1000000 ]
                    - name: col_float2_
                      count: 2
                      util: RandomNoWithDecimalPoints
                      params: [ 1, 1000000, 2 ]
                    - name: col_float5_
                      count: 2
                      util: RandomNoWithDecimalPoints
                      params: [ 1, 1000000, 5 ]
                    - name: col_boolean_
                      count: 1
                      util: RandomBoolean
                    - name: col_varchar10_id_
                      count: 1
                      util: RandomAString
                      params: [10, 10]
                    - name: col_varchar100_id_
                      count: 2
                      util: RandomAString
                      params: [100, 100]
                    - name: col_varchar500_id_
                      count: 1
                      util: RandomAString
                      params: [500, 500]

        afterLoad:
            - "DO $$ BEGIN FOR i IN 1..5 LOOP PERFORM * FROM pkeyBigint1M_1; END LOOP; END $$;"

        executeRules:
            - workload: AGGRG10_1_count_point_select_multiple_values
              customTags: schematype=regular,pkey=composite,partition=hash,aggregate=count,cardinality=multiple,projection=aggregate,aggregateon=rangepkey,queryshape=aggregate,filteron=rangepkey,filtertype=pointselect
              run:
                  - name: count_bigint_non_indexed_column
                    weight: 100
                    queries:
                        - query: select count(col_bigint_card2_1) from pkeyBigint1M_1 where col_bigint_card2_1 = ?
                          bindings:
                              -   util: RandomInt
                                  params: [ 1000001, 1001000 ]

            - workload: AGGRG10_2_count_point_select_multiple_values_IN
              customTags: schematype=regular,pkey=composite,partition=hash,aggregate=count,cardinality=multiple,projection=aggregate,aggregateon=rangepkey,queryshape=aggregate,filteron=rangepkey,filtertype=IN
              run:
                  - name: count_bigint_non_indexed_column
                    weight: 100
                    queries:
                        - query: select count(col_bigint_card2_1) from pkeyBigint1M_1 where col_bigint_card2_1 in (?,?)
                          bindings:
                              -   util: RandomInt
                                  count: 2
                                  params: [ 1000001, 1001000 ]

            - workload: AGGRG10_3_count_point_select_multiple_values_IN_groupby
              customTags: schematype=regular,pkey=composite,partition=hash,aggregate=count,cardinality=multiple,projection=aggregate,aggregateon=rangepkey,queryshape=aggregate,filteron=rangepkey,filtertype=IN,groupby=rangepkey
              run:
                  - name: count_bigint_non_indexed_column
                    weight: 100
                    queries:
                        - query: select count(col_bigint_card2_1) from pkeyBigint1M_1 where col_bigint_card2_1 in (?,?) group by col_bigint_card2_1
                          bindings:
                              -   util: RandomInt
                                  count: 2
                                  params: [ 1000001, 1001000 ]

            - workload: AGGRG10_4_count_indexed_col_multiple_values_groupby
              customTags: schematype=regular,pkey=composite,partition=hash,aggregate=count,cardinality=multiple,projection=aggregate,aggregateon=rangepkey,queryshape=aggregate,groupby=rangepkey
              run:
                  - name: count_bigint_non_indexed_column
                    weight: 100
                    queries:
                        - query: select col_bigint_card2_1,count(col_bigint_card2_1) from pkeyBigint1M_1 group by col_bigint_card2_1

            - workload: AGGRG10_5_count_indexed_col_multiple_values_groupby_orderby
              customTags: schematype=regular,pkey=composite,partition=hash,aggregate=count,cardinality=multiple,projection=aggregate,aggregateon=rangepkey,queryshape=aggregate,groupby=rangepkey,orderbyon=rangepkey
              run:
                  - name: count_bigint_non_indexed_column
                    weight: 100
                    queries:
                        - query: select col_bigint_card2_1,count(col_bigint_card2_1) from pkeyBigint1M_1 group by col_bigint_card2_1 order by col_bigint_card2_1

            - workload: AGGRG10_6_distinct_indexed_col_multiple_values_orderby
              customTags: schematype=regular,partition=hash,aggregate=count,cardinality=multiple,projection=aggregate,aggregateon=rangepkey,queryshape=aggregate,orderbyon=rangepkey
              run:
                  - name: count_bigint_non_indexed_column
                    weight: 100
                    queries:
                        - query: select distinct(col_bigint_card2_1) from pkeyBigint1M_1 order by col_bigint_card2_1