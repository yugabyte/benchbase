#TEST FOR YUGABYTE REGULAR TABLES
#GOAL14: Point-select latency through expression (functional) indexes vs plain secondary indexes that return the same row.
#        Varied dimension: index key kind (plain column, lower(varchar), lower(varchar) + INCLUDE).
#TESTS:
#    INDG14_1: baseline, plain varchar secondary index, 1-row point select
#    INDG14_2: lower(varchar) expression index, lower(col) = lower(?), 1 row
#    INDG14_3: lower(varchar) expression index with INCLUDE (col), index-only scan, 1 row
#Data: INDG14_U_tbl_1 1000000 rows; row i has col_varchar10_lower_1 = 'id-'||(1000000+i),
#      col_varchar10_upper_1/2 = 'ID-'||(1000000+i). Every lookup key is unique.
type: YUGABYTE
driver: com.yugabyte.Driver
url: jdbc:yugabytedb://{{endpoint}}:5433/yugabyte?sslmode=require&ApplicationName=featurebench&reWriteBatchedInserts=true&load-balance=false
username: {{username}}
password: {{password}}
batchsize: 128
isolation: TRANSACTION_REPEATABLE_READ
loaderThreads: 1
terminals: 1
collect_pg_stat_statements: true
use_dist_in_explain: true
yaml_version: v1.0
works:
    work:
        time_secs: 180
        active_terminals: 1
        rate: unlimited
        warmup: 60
microbenchmark:
    class: com.oltpbenchmark.benchmarks.featurebench.customworkload.YBDefaultMicroBenchmark
    properties:
        setAutoCommit: true
        create:
            - DROP TABLE IF EXISTS INDG14_U_tbl_1;
            - CREATE TABLE INDG14_U_tbl_1(col_bigint_id_1 bigint, col_varchar10_lower_1 varchar(10), col_varchar10_upper_1 varchar(10), col_varchar10_upper_2 varchar(10), col_float2_1 float(2), col_boolean_1 boolean, col_varchar100_1 varchar(100), PRIMARY KEY((col_bigint_id_1) HASH));
            - CREATE INDEX INDG14_U_tbl_1_varchar_idx ON INDG14_U_tbl_1(col_varchar10_lower_1);
            - CREATE INDEX INDG14_U_tbl_1_lower_idx ON INDG14_U_tbl_1(lower(col_varchar10_upper_1));
            - CREATE INDEX INDG14_U_tbl_1_lower_incl_idx ON INDG14_U_tbl_1(lower(col_varchar10_upper_2)) INCLUDE (col_varchar10_upper_2);
        cleanup:
            - DROP TABLE IF EXISTS INDG14_U_tbl_1;
        loadRules:
            - table: INDG14_U_tbl_
              count: 1
              rows: 1000000
              columns:
                  - name: col_bigint_id_
                    count: 1
                    util: PrimaryIntGen
                    params: [1, 1000000]
                  - name: col_varchar10_lower_
                    count: 1
                    util: CyclicSeqStringGen
                    params: [1, 1000000, "id-"]
                  - name: col_varchar10_upper_
                    count: 2
                    util: CyclicSeqStringGen
                    params: [1, 1000000, "ID-"]
                  - name: col_float2_
                    count: 1
                    util: RandomNoWithDecimalPoints
                    params: [1, 1000000, 2]
                  - name: col_boolean_
                    count: 1
                    util: RandomBoolean
                  - name: col_varchar100_
                    count: 1
                    util: RandomAString
                    params: [100, 100]

        executeRules:
            - workload: INDG14_1_plain_varchar_skey_point_select
              customTags: schematype=regular,partition=hash,pkey=single,cardinality=single,projection=all,filtercount=one,filteron=hashskey,filtertype=pointselect,queryshape=scan,columndatatype=varchar,indexexpr=none
              run:
                  - name: point_select_plain_varchar_skey
                    weight: 100
                    queries:
                        - query: select * from INDG14_U_tbl_1 where col_varchar10_lower_1 = ?
                          bindings:
                              - util: RandomUniqueCyclicStringGen
                                params: [1, 1000000, "id-"]

            - workload: INDG14_2_lower_expr_skey_point_select
              customTags: schematype=regular,partition=hash,pkey=single,cardinality=single,projection=all,filtercount=one,filteron=hashskey,filtertype=pointselect,queryshape=scan,columndatatype=varchar,indexexpr=lower
              run:
                  - name: point_select_lower_expr_skey
                    weight: 100
                    queries:
                        - query: select * from INDG14_U_tbl_1 where lower(col_varchar10_upper_1) = lower(?)
                          bindings:
                              - util: RandomUniqueCyclicStringGen
                                params: [1, 1000000, "ID-"]

            - workload: INDG14_3_lower_expr_include_index_only
              customTags: schematype=regular,partition=hash,pkey=single,cardinality=single,projection=indexed,filtercount=one,filteron=hashskey,filtertype=pointselect,queryshape=scan,columndatatype=varchar,indexexpr=lower
              run:
                  - name: index_only_lower_expr_skey
                    weight: 100
                    queries:
                        - query: select col_varchar10_upper_2 from INDG14_U_tbl_1 where lower(col_varchar10_upper_2) = lower(?)
                          bindings:
                              - util: RandomUniqueCyclicStringGen
                                params: [1, 1000000, "ID-"]
