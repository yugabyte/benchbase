#100000	col1	col2	    col3      col4
#Table1	1*1M	1000*1k	    10000*100
#Table2	1*1L	1000*100	10000*10
#Table3	1*10k	1000*10	    10000*1
type: POSTGRES
driver: org.postgresql.Driver
url: jdbc:postgresql://{{endpoint}}:5432/postgres?sslmode=require
username: {{username}}
password: {{password}}
batchsize: 128
isolation: TRANSACTION_REPEATABLE_READ
loaderthreads: 1
terminals: 1
collect_pg_stat_statements: true
yaml_version: v2.0
works:
    work:
        time_secs: 180
        active_terminals: 1
        rate: unlimited
        warmup: 60
microbenchmark:
    class: com.oltpbenchmark.benchmarks.featurebench.customworkload.YBDefaultMicroBenchmark
    properties:
        setAutoCommit: true
        create:
          - DROP TABLE IF EXISTS iNDG10_U_pkeyBigint1M_1;
          - CREATE TABLE iNDG10_U_pkeyBigint1M_1(col_bigint_card1_1 bigint, col_bigint_card2_1 bigint, col_bigint_card3_1 bigint, col_bigint_id_1 bigint, col_bigint_id_2 bigint, col_bigint_id_3 bigint, col_float2_1 float(2), col_float2_2 float(2), col_float5_1 float(5), col_float5_2 float(5), col_boolean_1 boolean, col_varchar10_id_1 varchar(10), col_varchar100_id_1 varchar(100), col_varchar100_id_2 varchar(100), col_varchar500_id_1 varchar(500), PRIMARY KEY(col_bigint_card1_1, col_bigint_card2_1, col_bigint_card3_1, col_bigint_id_1));

        cleanup:
            - DROP TABLE IF EXISTS iNDG10_U_pkeyBigint1M_1;

        loadRules:
              - table: iNDG10_U_pkeyBigint1M_
                count: 1
                rows: 1000000
                columns:
                    - name: col_bigint_card1_
                      count: 1
                      util: RandomUniqueCyclicIntGen
                      params: [ 1000001, 1000050, 10000 ]
                    - name: col_bigint_card2_
                      count: 1
                      util: CyclicSeqIntGen
                      params: [ 1000001, 1001000 ]
                    - name: col_bigint_card3_
                      count: 1
                      util: CyclicSeqIntGen
                      params: [ 1000001, 1010000]
                    - name: col_bigint_id_
                      count: 3
                      util: PrimaryIntGen
                      params: [ 1, 1000000 ]
                    - name: col_float2_
                      count: 2
                      util: RandomNoWithDecimalPoints
                      params: [ 1, 1000000, 2 ]
                    - name: col_float5_
                      count: 2
                      util: RandomNoWithDecimalPoints
                      params: [ 1, 1000000, 5 ]
                    - name: col_boolean_
                      count: 1
                      util: RandomBoolean
                    - name: col_varchar10_id_
                      count: 1
                      util: PrimaryStringGen
                      params: [1, 10]
                    - name: col_varchar100_id_
                      count: 2
                      util: PrimaryStringGen
                      params: [1, 100]
                    - name: col_varchar500_id_
                      count: 1
                      util: PrimaryStringGen
                      params: [1, 500]


        executeRules:

            - workload: INDG10_1_data_cardinality_hashtbl_point_lookup_index_scan_using_comp_skey_first_part_hash_1M
              customTags: customer=2
              run:
                  - name: hashtbl_index_scan_using_sec_index
                    weight: 100
                    queries:
                        - query: select * from iNDG10_U_pkeyBigint1M_1 where col_bigint_card1_1=?
                          bindings:
                            - util: RandomUniqueCyclicIntGen
                              params: [ 1000001, 1000050 ]

            - workload: INDG10_2_data_cardinality_hashtbl_point_lookup_index_scan_using_comp_skey_sec_part_hash_1k
              run:
                  - name: hashtbl_index_scan_using_sec_index
                    weight: 100
                    queries:
                        - query: select * from iNDG10_U_pkeyBigint1M_1 where col_bigint_card2_1=?
                          bindings:
                            - util: RandomInt
                              params: [ 1000001, 1001000 ]

            - workload: INDG10_4_data_cardinality_hashtbl_point_lookup_index_scan_using_comp_skey_sec_part_hash_1k_two_conditions
              customTags: customer=1
              run:
                  - name: hashtbl_index_scan_using_sec_index
                    weight: 100
                    queries:
                        - query: select * from iNDG10_U_pkeyBigint1M_1 where col_bigint_card1_1=? and col_bigint_card2_1 between ? and ?
                          bindings:
                            - util: RandomInt
                              params: [ 1000001, 1000050 ]
                            - util: RandomInt
                              params: [ 1000001, 1001000 ]
                              referenceName: start_value
                            - util: ExpressionEval
                              params:
                                  - "start_value + 50"

            - workload: INDG10_5_data_cardinality_hashtbl_point_lookup_index_scan_using_comp_skey_third_part_hash_100_two_conditions
              customTags: customer=2
              run:
                  - name: hashtbl_index_scan_using_sec_index
                    weight: 100
                    queries:
                        - query: select * from iNDG10_U_pkeyBigint1M_1 where col_bigint_card1_1=? and col_bigint_card3_1=?
                          bindings:
                            - util: RandomInt
                              params: [ 1000001, 1000050 ]
                            - util: RandomInt
                              params: [ 1000001, 1010000 ]
