type: POSTGRES
driver: org.postgresql.Driver
url: jdbc:postgresql://{{endpoint}}:5432/postgres?sslmode=require
username: {{username}}
password: {{password}}
batchsize: 128
isolation: TRANSACTION_REPEATABLE_READ
loaderthreads: 1
terminals: 1
collect_pg_stat_statements: true
analyze_on_all_tables: true
yaml_version: v2.0
works:
    work:
        time_secs: 180
        active_terminals: 1
        rate: unlimited
        warmup: 60
microbenchmark:
    class: com.oltpbenchmark.benchmarks.featurebench.customworkload.YBDefaultMicroBenchmark
    properties:
        setAutoCommit: true
        create:
          - DROP TABLE IF EXISTS pkeyBigint1M_1;
          - CREATE TABLE pkeyBigint1M_1(col_bigint_card1_1 bigint, col_bigint_card2_1 bigint, col_bigint_card3_1 bigint, col_bigint_id_1 bigint, col_bigint_id_2 bigint, col_bigint_id_3 bigint, col_float2_1 float(2), col_float2_2 float(2), col_float5_1 float(5), col_float5_2 float(5), col_boolean_1 boolean, col_varchar10_id_1 varchar(10), col_varchar100_id_1 varchar(100), col_varchar100_id_2 varchar(100), col_varchar500_id_1 varchar(500), PRIMARY KEY(col_bigint_card1_1, col_bigint_card2_1, col_bigint_card3_1, col_bigint_id_1));
        cleanup:
            - DROP TABLE IF EXISTS pkeyBigint1M_1;

        loadRules:
              - table: pkeyBigint1M_
                count: 1
                rows: 1000000
                columns:
                    - name: col_bigint_card1_
                      count: 1
                      util: OneNumberFromArray
                      params: [ 1000000 ]
                    - name: col_bigint_card2_
                      count: 1
                      util: CyclicSeqIntGen
                      params: [ 1000001, 1001000 ]
                    - name: col_bigint_card3_
                      count: 1
                      util: CyclicSeqIntGen
                      params: [ 1000001, 1010000]
                    - name: col_bigint_id_
                      count: 3
                      util: PrimaryIntGen
                      params: [ 1, 1000000 ]
                    - name: col_float2_
                      count: 2
                      util: RandomNoWithDecimalPoints
                      params: [ 1, 1000000, 2 ]
                    - name: col_float5_
                      count: 2
                      util: RandomNoWithDecimalPoints
                      params: [ 1, 1000000, 5 ]
                    - name: col_boolean_
                      count: 1
                      util: RandomBoolean
                    - name: col_varchar10_id_
                      count: 1
                      util: PrimaryStringGen
                      params: [1, 10]
                    - name: col_varchar100_id_
                      count: 2
                      util: PrimaryStringGen
                      params: [1, 100]
                    - name: col_varchar500_id_
                      count: 1
                      util: PrimaryStringGen
                      params: [1, 500]

        executeRules:
            - workload: AGGRG10_1_count_point_select_multiple_values
              run:
                  - name: count_bigint_non_indexed_column
                    weight: 100
                    queries:
                        - query: select count(col_bigint_card2_1) from pkeyBigint1M_1 where col_bigint_card2_1 = ?
                          bindings:
                              -   util: RandomInt
                                  params: [ 1000001, 1001000 ]

            - workload: AGGRG10_2_count_point_select_multiple_values_IN
              run:
                  - name: count_bigint_non_indexed_column
                    weight: 100
                    queries:
                        - query: select count(col_bigint_card2_1) from pkeyBigint1M_1 where col_bigint_card2_1 in (?,?)
                          bindings:
                              -   util: RandomInt
                                  count: 2
                                  params: [ 1000001, 1001000 ]

            - workload: AGGRG10_3_count_point_select_multiple_values_IN_groupby
              run:
                  - name: count_bigint_non_indexed_column
                    weight: 100
                    queries:
                        - query: select count(col_bigint_card2_1) from pkeyBigint1M_1 where col_bigint_card2_1 in (?,?) group by col_bigint_card2_1
                          bindings:
                              -   util: RandomInt
                                  count: 2
                                  params: [ 1000001, 1001000 ]

            - workload: AGGRG10_4_count_indexed_col_multiple_values_groupby
              run:
                  - name: count_bigint_non_indexed_column
                    weight: 100
                    queries:
                        - query: select col_bigint_card2_1,count(col_bigint_card2_1) from pkeyBigint1M_1 group by col_bigint_card2_1

            - workload: AGGRG10_5_count_indexed_col_multiple_values_groupby_orderby
              run:
                  - name: count_bigint_non_indexed_column
                    weight: 100
                    queries:
                        - query: select col_bigint_card2_1,count(col_bigint_card2_1) from pkeyBigint1M_1 group by col_bigint_card2_1 order by col_bigint_card2_1

            - workload: AGGRG10_6_distinct_indexed_col_multiple_values_orderby
              run:
                  - name: count_bigint_non_indexed_column
                    weight: 100
                    queries:
                        - query: select distinct(col_bigint_card3_1) from pkeyBigint1M_1 order by col_bigint_card3_1