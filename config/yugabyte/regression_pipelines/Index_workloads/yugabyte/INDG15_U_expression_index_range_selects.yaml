#TEST FOR YUGABYTE REGULAR TABLES
#GOAL15: 100-row range-scan latency through ASC expression (functional) indexes vs plain ASC secondary indexes that return the same rows.
#        Varied dimension: index key kind (plain column, (a + b), lower(varchar)).
#TESTS:
#    INDG15_1: baseline, plain bigint ASC index, BETWEEN over 100 keys
#    INDG15_2: (col_bigint_id_3 + col_bigint_id_4) ASC expression index, BETWEEN over 100 rows
#    INDG15_3: baseline, plain varchar ASC index, ORDER BY col LIMIT 100 served by the index (no sort)
#    INDG15_4: lower(varchar) ASC expression index, ORDER BY lower(col) LIMIT 100 served by the index (no sort)
#Data: INDG15_U_tbl_1 1000000 rows; row i has col_bigint_id_1..4 = i (so id_3 + id_4 = 2i), col_varchar10_lower_1 = 'id-'||(1000000+i),
#      col_varchar10_upper_1 = 'ID-'||(1000000+i). Fixed-width strings sort like their numbers.
type: YUGABYTE
driver: com.yugabyte.Driver
url: jdbc:yugabytedb://{{endpoint}}:5433/yugabyte?sslmode=require&ApplicationName=featurebench&reWriteBatchedInserts=true&load-balance=false
username: {{username}}
password: {{password}}
batchsize: 128
isolation: TRANSACTION_REPEATABLE_READ
loaderThreads: 1
terminals: 1
collect_pg_stat_statements: true
use_dist_in_explain: true
yaml_version: v1.0
works:
    work:
        time_secs: 180
        active_terminals: 1
        rate: unlimited
        warmup: 60
microbenchmark:
    class: com.oltpbenchmark.benchmarks.featurebench.customworkload.YBDefaultMicroBenchmark
    properties:
        setAutoCommit: true
        create:
            - DROP TABLE IF EXISTS INDG15_U_tbl_1;
            - CREATE TABLE INDG15_U_tbl_1(col_bigint_id_1 bigint, col_bigint_id_2 bigint, col_bigint_id_3 bigint, col_bigint_id_4 bigint, col_varchar10_lower_1 varchar(10), col_varchar10_upper_1 varchar(10), col_float2_1 float(2), col_boolean_1 boolean, col_varchar100_1 varchar(100), PRIMARY KEY((col_bigint_id_1) HASH));
            - CREATE INDEX INDG15_U_tbl_1_bigint_idx ON INDG15_U_tbl_1(col_bigint_id_2 ASC);
            - CREATE INDEX INDG15_U_tbl_1_sum_idx ON INDG15_U_tbl_1((col_bigint_id_3 + col_bigint_id_4) ASC);
            - CREATE INDEX INDG15_U_tbl_1_varchar_idx ON INDG15_U_tbl_1(col_varchar10_lower_1 ASC);
            - CREATE INDEX INDG15_U_tbl_1_lower_idx ON INDG15_U_tbl_1(lower(col_varchar10_upper_1) ASC);
        cleanup:
            - DROP TABLE IF EXISTS INDG15_U_tbl_1;
        loadRules:
            - table: INDG15_U_tbl_
              count: 1
              rows: 1000000
              columns:
                  - name: col_bigint_id_
                    count: 4
                    util: PrimaryIntGen
                    params: [1, 1000000]
                  - name: col_varchar10_lower_
                    count: 1
                    util: CyclicSeqStringGen
                    params: [1, 1000000, "id-"]
                  - name: col_varchar10_upper_
                    count: 1
                    util: CyclicSeqStringGen
                    params: [1, 1000000, "ID-"]
                  - name: col_float2_
                    count: 1
                    util: RandomNoWithDecimalPoints
                    params: [1, 1000000, 2]
                  - name: col_boolean_
                    count: 1
                    util: RandomBoolean
                  - name: col_varchar100_
                    count: 1
                    util: RandomAString
                    params: [100, 100]

        executeRules:
            - workload: INDG15_1_plain_bigint_skey_range_select
              customTags: schematype=regular,partition=hash,pkey=single,cardinality=multiple,projection=all,filtercount=one,filteron=rangeskey,filtertype=comparision,queryshape=scan,columndatatype=bigint,indexexpr=none
              run:
                  - name: range_select_plain_bigint_skey
                    weight: 100
                    queries:
                        - query: select * from INDG15_U_tbl_1 where col_bigint_id_2 between ? and ?
                          bindings:
                              - util: RandomInt
                                params: [1, 999901]
                                referenceName: start_value
                              - util: ExpressionEval
                                params:
                                    - "start_value + 99"

            - workload: INDG15_2_arithmetic_expr_skey_range_select
              customTags: schematype=regular,partition=hash,pkey=single,cardinality=multiple,projection=all,filtercount=one,filteron=rangeskey,filtertype=comparision,queryshape=scan,columndatatype=bigint,indexexpr=arithmetic
              run:
                  - name: range_select_arithmetic_expr_skey
                    weight: 100
                    queries:
                        - query: select * from INDG15_U_tbl_1 where (col_bigint_id_3 + col_bigint_id_4) between ? and ?
                          bindings:
                              - util: RandomInt
                                params: [2, 1999801]
                                referenceName: start_value
                              - util: ExpressionEval
                                params:
                                    - "start_value + 199"

            - workload: INDG15_3_plain_varchar_skey_orderby_limit
              customTags: schematype=regular,partition=hash,pkey=single,cardinality=multiple,projection=all,filtercount=one,filteron=rangeskey,filtertype=comparision,queryshape=orderby,orderbyon=rangeskey,columndatatype=varchar,indexexpr=none
              run:
                  - name: orderby_limit_plain_varchar_skey
                    weight: 100
                    queries:
                        - query: select * from INDG15_U_tbl_1 where col_varchar10_lower_1 >= ('id-' || ?) order by col_varchar10_lower_1 limit 100
                          bindings:
                              - util: RandomInt
                                params: [1000001, 1999901]

            - workload: INDG15_4_lower_expr_skey_orderby_limit
              customTags: schematype=regular,partition=hash,pkey=single,cardinality=multiple,projection=all,filtercount=one,filteron=rangeskey,filtertype=comparision,queryshape=orderby,orderbyon=rangeskey,columndatatype=varchar,indexexpr=lower
              run:
                  - name: orderby_limit_lower_expr_skey
                    weight: 100
                    queries:
                        - query: select * from INDG15_U_tbl_1 where lower(col_varchar10_upper_1) >= lower('ID-' || ?) order by lower(col_varchar10_upper_1) limit 100
                          bindings:
                              - util: RandomInt
                                params: [1000001, 1999901]
